name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with the commit hash (cache busting)
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html js/app.js
          grep -q "?v=${GITHUB_SHA::8}" index.html
          ! grep -rq "?v=dev" index.html js/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
